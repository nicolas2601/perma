name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build (production, live inference)
        run: npm run build

      - name: Guard - no MSW in production bundle
        run: |
          if grep -rqE 'setupWorker|setupServer|mockServiceWorker' dist; then
            echo "MSW code found in dist/"
            exit 1
          fi

      - name: Bundle budget
        run: npm run size

      - name: Lighthouse CI (mobile, LCP and CLS budgets)
        run: ./node_modules/.bin/lhci autorun --config=lighthouserc.json

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (chromium, all viewport projects)
        run: npm run e2e

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
