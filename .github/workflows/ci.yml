name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build (production, live inference)
        run: bun run build

      - name: Guard - no MSW in production bundle
        run: node scripts/check-no-msw-in-dist.mjs dist

      - name: Bundle budget
        run: bun run size

      - name: Lighthouse CI (mobile, LCP and CLS budgets)
        run: ./node_modules/.bin/lhci autorun --config=lighthouserc.json

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (chromium, all viewport projects)
        run: bun run e2e

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
