<svg xmlns="http://www.w3.org/2000/svg" fill="none" aria-labelledby="ed-title ed-desc" role="img" viewBox="0 0 160 120"><title id="ed-title">Exportación lista</title><desc id="ed-desc">Una pieza entra a una bandeja con marca de verificación.</desc><style>.ill-check{stroke-dasharray:1;stroke-dashoffset:0}@keyframes ill-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.ill-animate .ill-check{animation:ill-draw 320ms ease-out both}@media (prefers-reduced-motion: reduce){.ill-animate .ill-check{animation:none}}</style><rect width="92" height="30" x="34" y="70" fill="#006779" rx="10"/><rect width="68" height="8" x="46" y="66" fill="#0b6b5a" rx="4"/><rect width="52" height="40" x="54" y="26" fill="#dcf1ea" rx="10"/><path stroke="#006779" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" d="m68 46 9 9 16-18" class="ill-check" pathLength="1"/><rect width="14" height="14" x="132" y="20" fill="#fcefc9" rx="4" transform="rotate(18 139 27)"/><circle cx="22" cy="98" r="5" fill="#dcebf7"/></svg>